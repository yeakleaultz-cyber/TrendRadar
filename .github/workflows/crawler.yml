GitHub 的新编辑器为了省资源，只加载你屏幕上看得见的几十行。浏览器的 Ctrl+F 只能搜「已经显示出来」的文字，所以你搜 disable 会没结果——除非你先手动滚到那段附近。

不用搜了，改用「整份替换」，4 步搞定
第 1 步：复制全文

打开我刚发你的 GitHub粘贴用全文.txt，按 Ctrl+A 全选，再 Ctrl+C 复制。

第 2 步：打开编辑页

https://github.com/yeakleaultz-cyber/TrendRadar/edit/master/.github/workflows/crawler.yml
第 3 步：粘贴覆盖

点一下代码区域里面，按 Ctrl+A 全选（选中原来所有内容），再按 Ctrl+V 粘贴——原来的内容就全被替换成改好的版本了。

第 4 步：提交

拉到页面最底下，在绿色按钮 Commit changes 上方有个框让你写说明，随便填个「修改定时」就行，然后点 Commit changes。

粘贴后你可以自己抽查两眼：第 44、45 行应该是 cron: "30 0 * * *" 和 cron: "30 12 * * *"；按 Ctrl+F 搜 gh workflow 应该一个都搜不到（因为已经删了）。这就算改对了。

最后一步别忘了
提交完，回到「行动」页 → 左侧点「获取热门新闻」→ 右侧点 Run workflow → 弹窗里再点绿色的 Run workflow。

